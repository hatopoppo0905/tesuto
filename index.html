<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D 迷路脱出ゲーム</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            font-family: sans-serif;
            touch-action: none; /* スマホのズーム・スクロール・ピンチ操作を完全防止 */
        }
        
        /* メニュー・画面オーバーレイ共通 */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            color: #fff;
        }
        
        .hidden {
            display: none !important;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(255,255,255,0.5);
        }

        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 80%;
            max-width: 250px;
        }

        button.menu-btn {
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            color: #fff;
            background: #222;
            border: 2px solid #00d2ff;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
        }

        button.menu-btn:active {
            background: #00d2ff;
            color: #000;
        }

        /* ゲーム内メッセージ */
        #game-message {
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            border: 1px solid #ffcc00;
            color: #ffcc00;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            z-index: 50;
            pointer-events: none;
            text-align: center;
        }
    </style>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.161.0/build/three.module.js"
            }
        }
    </script>
</head>
<body>

    <div id="main-menu" class="overlay">
        <h1>迷路脱出ゲーム</h1>
        <div class="btn-container">
            <button id="mode-pc-btn" class="menu-btn">💻 PCモードで開始</button>
            <button id="mode-touch-btn" class="menu-btn">📱 スマホモードで開始</button>
        </div>
    </div>

    <div id="game-over-screen" class="overlay hidden">
        <h1 style="color: #ff3333;">GAME OVER</h1>
        <div class="btn-container">
            <button id="retry-btn" class="menu-btn">🔄 もう一度挑戦</button>
            <button id="game-over-menu-btn" class="menu-btn">🏠 タイトルへ</button>
        </div>
    </div>

    <div id="clear-screen" class="overlay hidden">
        <h1 style="color: #00ff88;">GAME CLEAR!</h1>
        <div class="btn-container">
            <button id="clear-retry-btn" class="menu-btn">🔄 もう一度遊ぶ</button>
            <button id="clear-menu-btn" class="menu-btn">🏠 タイトルへ</button>
        </div>
    </div>

    <div id="game-message" class="hidden"></div>
    <div id="touch-ui"></div>

    <script type="module" src="./script.js"></script>
</body>
</html>
